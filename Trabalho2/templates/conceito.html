{% extends 'layout.html' %}

{% block head %}
    <title>{{designacao}}</title>
{% endblock %}

{% block body %}
    <div class="container" style="min-height: 400px;">
        <div class="card mx-4" style="margin-top: 80px; height: 250px;">
            <h2 class="fs-2 fw-bold ps-4 text-capitalize mx-4" style="margin-top: 60px;">{{designacao}}</h2>
            <p class=" fs-4 ps-5 mx-4" style="margin-top: 20px;">{{descricao}}</p>  
            <div class="d-flex justify-content-end mt-auto mx-3 py-3">
                <a href="/conceitos" type="button" class="btn btn-primary" >Voltar</a>
                <button type="button" class="btn btn-danger" onclick="apagar_conceito('{{designacao}}')">
                    Apagar
                </button>
            </div>
        </div>  
    </div>

{% endblock %}
